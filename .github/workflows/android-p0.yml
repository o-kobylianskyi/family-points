name: Android P0 / Independent CI

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-p0.yml'
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Also run full JVM suite and build both debug APKs (main CI already does this)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# This workflow is isolated from FamilyPoints CI's cancel-in-progress main/ref
# group. An unrelated Web/Backend push cannot cancel an Android P0 run.
# One run per source SHA also prevents later Android commits from cancelling
# earlier failure evidence. Push CI runs the 3 targeted tests only; full suite
# remains in main CI and can be requested manually. No family/device data used.
concurrency:
  group: android-p0-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-p0:
    name: Android P0 / targeted lost-response regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Print evidence SHA
        run: git rev-parse HEAD

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'

      - name: Install stable Android SDK 36
        run: sdkmanager 'platforms;android-36'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify three Android P0 lost-response regressions first
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -PfamilyPointsCiAndroidSdk=36 \
            :app:testDebugUnitTest --tests 'com.olehkobylianskyi.familypoints.android.data.TemplateReceiptRepositoryHttpTest.lostActivationResponseRecoversWithOriginalIdAndNoRepost' \
            --tests 'com.olehkobylianskyi.familypoints.android.network.OfflinePointsReplayHttpTest.lostResponseKeepsOriginalIdForExplicitIdempotentReconciliation' \
            --tests 'com.olehkobylianskyi.familypoints.android.network.TemplateReceiptHttpFaultTest.lostActivationPostResponseRecoveredOnlyByGetWithSameUuid'

      - name: Require exact three regression test XML results
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          root = pathlib.Path("app/build/test-results/testDebugUnitTest")
          cases = {
              "lostActivationResponseRecoversWithOriginalIdAndNoRepost",
              "lostResponseKeepsOriginalIdForExplicitIdempotentReconciliation",
              "lostActivationPostResponseRecoveredOnlyByGetWithSameUuid",
          }
          seen = {}
          for path in root.glob("TEST-*.xml"):
              suite = ET.parse(path).getroot()
              for case in suite.iter("testcase"):
                  name = case.get("name", "")
                  if name in cases:
                      seen.setdefault(name, []).append((case.get("classname"), len(case.findall("failure")), len(case.findall("error")), len(case.findall("skipped"))))
          print("Android P0 exact regressions on source SHA:")
          failed = False
          for name in sorted(cases):
              matches = seen.get(name, [])
              ok = len(matches) == 1 and all(v == 0 for v in matches[0][1:])
              print(f"  {name}: {'PASS' if ok else 'MISSING, DUPLICATED OR FAILED'}")
              failed |= not ok
          if failed:
              sys.exit("Missing or failed Android P0 regression in generated test XML")
          PY

      - name: Run optional full Android JVM suite and build both debug APKs
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: |
          ./gradlew --no-daemon --stacktrace -PfamilyPointsCiAndroidSdk=36 \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Publish Android regression test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-p0-test-reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

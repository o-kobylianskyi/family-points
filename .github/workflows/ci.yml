name: FamilyPoints CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Preserve one result for every push SHA, even when parallel role chats push quickly.
# Distinct run IDs avoid GitHub's concurrency pending-run replacement for older pushes.
# Runner capacity controls queueing; no run is cancelled solely by a later push.
concurrency:
  group: family-points-ci-run-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  changes:
    name: CI / determine affected components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      android: ${{ steps.scope.outputs.android }}
      web: ${{ steps.scope.outputs.web }}
      compose: ${{ steps.scope.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Safe changed-file routing (full on unknown/shared)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          b=false; a=false; w=false; c=false; full=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" || ( "$EVENT_NAME" == "push" && "$HEAD_MESSAGE" == *"[full-ci]"* ) ]]; then
            full=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then base="$PR_BASE"; else base="$PUSH_BASE"; fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              full=true
            elif ! git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/fp-changed-files"; then
              full=true
            else
              while IFS= read -r file; do
                case "$file" in
                  frontend/Dockerfile.beta|frontend/deploy/nginx.beta.conf) w=true; c=true ;;
                  frontend/*|qa/*) w=true ;;
                  android/*) a=true ;;
                  scripts/beta/*|compose.beta.yml|Dockerfile.beta) c=true ;;
                  # Any CI workflow change must validate all build families.
                  .github/workflows/*) full=true ;;
                  docs/*|README.md|LICENSE) ;;
                  *) full=true ;;
                esac
              done < "$RUNNER_TEMP/fp-changed-files"
            fi
          fi
          if [[ "$full" == true ]]; then b=true; a=true; w=true; c=true; fi
          for name in backend android web compose; do
            case "$name" in
              backend) value="$b" ;;
              android) value="$a" ;;
              web) value="$w" ;;
              compose) value="$c" ;;
            esac
            echo "$name=$value" >> "$GITHUB_OUTPUT"
            echo "$name=$value" >> "$GITHUB_STEP_SUMMARY"
          done

  backend-tests:
    needs: changes
    name: Java 21 / Maven / PostgreSQL Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Report backend scope selection
        run: echo 'backend selected = ${{ needs.changes.outputs.backend }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java 21
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Confirm Docker
        if: needs.changes.outputs.backend == 'true'
        run: docker info
      - name: Print tested commit
        if: needs.changes.outputs.backend == 'true'
        run: git rev-parse HEAD
      - name: Run all backend tests
        if: needs.changes.outputs.backend == 'true'
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify
      - name: Publish Surefire reports
        if: needs.changes.outputs.backend == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  android-debug:
    needs: changes
    name: Android / Gradle debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Report android scope selection
        run: echo 'android selected = ${{ needs.changes.outputs.android }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java 21
        if: needs.changes.outputs.android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        if: needs.changes.outputs.android == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0"
      - name: Install stable Android SDK 36 for CI fallback
        if: needs.changes.outputs.android == 'true'
        run: sdkmanager "platforms;android-36"
      - name: Cache Gradle
        if: needs.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: Print tested commit
        if: needs.changes.outputs.android == 'true'
        run: git rev-parse HEAD
      - name: Compile Android and run unit tests
        if: needs.changes.outputs.android == 'true'
        run: |
          chmod +x ./gradlew
          # The local Android Studio build remains on API 37; CI fallback compiles API 36.
          ./gradlew --no-daemon --stacktrace -PfamilyPointsCiAndroidSdk=36 :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Publish Android test reports
        if: needs.changes.outputs.android == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  frontend-build:
    needs: changes
    name: Web / Node / Vite production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Report web scope selection
        run: echo 'web selected = ${{ needs.changes.outputs.web }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Node
        if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Print tested commit
        if: needs.changes.outputs.web == 'true'
        run: git rev-parse HEAD
      - name: Install dependencies
        if: needs.changes.outputs.web == 'true'
        run: npm ci
      - name: Check locale completeness
        if: needs.changes.outputs.web == 'true'
        run: npm run i18n:check
      - name: Run source-backed Web regression suite
        if: needs.changes.outputs.web == 'true'
        run: npm run test:regression
      - name: Lint Web source
        if: needs.changes.outputs.web == 'true'
        run: npm run lint
      - name: Compile frontend
        if: needs.changes.outputs.web == 'true'
        run: npm run build

  beta-compose-validation:
    needs: changes
    name: BETA / Docker Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Report compose scope selection
        run: echo 'compose selected = ${{ needs.changes.outputs.compose }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Parse Windows release tooling PowerShell scripts
        if: needs.changes.outputs.compose == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'scripts/beta/release-gate.ps1',
            'scripts/android/release.ps1',
            'scripts/android/build-release-apk.ps1',
            'scripts/android/publish-to-contabo.ps1'
          )
          $hasErrors = $false
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                Write-Error ("{0}:{1}: {2}" -f $file,$parseError.Extent.StartLineNumber,$parseError.Message)
              }
              $hasErrors = $true
            } else {
              Write-Host "Parser PASS: $file"
            }
          }
          if ($hasErrors) { exit 1 }
      - name: Verify compose and secrets placeholders
        if: needs.changes.outputs.compose == 'true'
        env:
          DB_PASSWORD: ci-placeholder-not-a-real-secret
          JWT_SECRET: ci-placeholder-jwt-secret-not-real
        run: |
          docker compose -f compose.beta.yml config --quiet
          test -f Dockerfile.beta
          test -f frontend/Dockerfile.beta
          test -f frontend/deploy/nginx.beta.conf
          bash -n scripts/beta/smoke.sh
          bash -n scripts/beta/backup.sh
          test -f .env.beta.example

  full-ci-attestation:
    name: Full CI / exact-SHA evidence
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.backend == 'true' && needs.changes.outputs.android == 'true' && needs.changes.outputs.web == 'true' && needs.changes.outputs.compose == 'true' }}
    needs: [changes, backend-tests, android-debug, frontend-build, beta-compose-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BACKEND_RESULT: ${{ needs['backend-tests'].result }}
      ANDROID_RESULT: ${{ needs['android-debug'].result }}
      WEB_RESULT: ${{ needs['frontend-build'].result }}
      COMPOSE_RESULT: ${{ needs['beta-compose-validation'].result }}
      CI_SHA: ${{ github.sha }}
      CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Reject incomplete or failed four-component CI
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Full CI / SHA evidence"
            echo ""
            echo "- Commit: $CI_SHA"
            echo "- Run: $CI_RUN_URL"
            echo "- Backend: $BACKEND_RESULT"
            echo "- Android: $ANDROID_RESULT"
            echo "- Web: $WEB_RESULT"
            echo "- Compose: $COMPOSE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$BACKEND_RESULT" "$ANDROID_RESULT" "$WEB_RESULT" "$COMPOSE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Full four-component CI was not successful for $CI_SHA"
              exit 1
            fi
          done
          echo "FULL FOUR-COMPONENT CI PASS: $CI_SHA"
      - name: Write non-deployment CI evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          report = {
              "sourceSha": os.environ["CI_SHA"],
              "runUrl": os.environ["CI_RUN_URL"],
              "backend": os.environ["BACKEND_RESULT"],
              "android": os.environ["ANDROID_RESULT"],
              "web": os.environ["WEB_RESULT"],
              "compose": os.environ["COMPOSE_RESULT"],
              "fullCiVerified": True,
              "qaAccepted": False,
              "releaseApproved": False,
              "deploymentExecuted": False
          }
          with open("full-ci-evidence.json", "w", encoding="utf-8") as out:
              json.dump(report, out, indent=2)
              out.write("\n")
          PY
      - name: Upload full CI evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-ci-evidence
          path: full-ci-evidence.json
          if-no-files-found: error
          retention-days: 30

  push-ci-report:
    name: CI / per-commit outcome report
    if: ${{ always() }}
    needs: [changes, backend-tests, android-debug, frontend-build, beta-compose-validation, full-ci-attestation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SCOPE_RESULT: ${{ needs.changes.result }}
      BACKEND_SELECTED: ${{ needs.changes.outputs.backend }}
      ANDROID_SELECTED: ${{ needs.changes.outputs.android }}
      WEB_SELECTED: ${{ needs.changes.outputs.web }}
      COMPOSE_SELECTED: ${{ needs.changes.outputs.compose }}
      BACKEND_RESULT: ${{ needs['backend-tests'].result }}
      ANDROID_RESULT: ${{ needs['android-debug'].result }}
      WEB_RESULT: ${{ needs['frontend-build'].result }}
      COMPOSE_RESULT: ${{ needs['beta-compose-validation'].result }}
      FULL_ATTESTATION_RESULT: ${{ needs['full-ci-attestation'].result }}
    steps:
      - name: Report exact per-push CI selection and outcome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          names = ("backend", "android", "web", "compose")
          selected = {
              "backend": os.environ["BACKEND_SELECTED"],
              "android": os.environ["ANDROID_SELECTED"],
              "web": os.environ["WEB_SELECTED"],
              "compose": os.environ["COMPOSE_SELECTED"]
          }
          results = {
              "backend": os.environ["BACKEND_RESULT"],
              "android": os.environ["ANDROID_RESULT"],
              "web": os.environ["WEB_RESULT"],
              "compose": os.environ["COMPOSE_RESULT"]
          }
          scope_ok = os.environ["SCOPE_RESULT"] == "success"
          all_selected = scope_ok and all(selected[k] == "true" for k in names)
          scoped_ok = scope_ok and all(
              results[k] == "success" if selected[k] == "true" else results[k] in ("success", "skipped")
              for k in names
          )
          full_pass = all_selected and all(results[k] == "success" for k in names) and os.environ["FULL_ATTESTATION_RESULT"] == "success"
          report = {
              "sourceSha": os.environ["SOURCE_SHA"],
              "event": os.environ["EVENT_NAME"],
              "runUrl": os.environ["RUN_URL"],
              "scopeResult": os.environ["SCOPE_RESULT"],
              "selected": selected,
              "results": results,
              "fullAttestationResult": os.environ["FULL_ATTESTATION_RESULT"],
              "scopedCiPassed": scoped_ok,
              "fullCiVerified": full_pass,
              "qaAccepted": False,
              "releaseApproved": False,
              "deploymentExecuted": False
          }
          with open("ci-push-result.json", "w", encoding="utf-8") as out:
              json.dump(report, out, indent=2)
              out.write("\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## CI per-commit outcome\n\n")
              out.write(f"- SHA: \`{report['sourceSha']}\`\n")
              out.write(f"- Event: {report['event']}\n")
              out.write(f"- Run: {report['runUrl']}\n")
              out.write(f"- Scope evaluation: {report['scopeResult']}\n\n")
              out.write("| Component | Selected | Job result |\n|---|---|---|\n")
              for k in names:
                  out.write(f"| {k} | {selected[k]} | {results[k]} |\n")
              out.write(f"\n- Scoped CI PASS: {scoped_ok}\n")
              out.write(f"- Full CI accepted: {full_pass}\n")
              if not any(selected[k] == "true" for k in names):
                  out.write("- No component tests selected (for example docs-only push); NOT FULL CI.\n")
          print(f"CI REPORT SHA {report['sourceSha']}: scoped={scoped_ok}, full={full_pass}")
          if not scoped_ok:
              raise SystemExit("Push CI scope or one or more selected jobs failed")
          PY
      - name: Upload per-commit CI outcome JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-push-result
          path: ci-push-result.json
          if-no-files-found: warn
          retention-days: 14

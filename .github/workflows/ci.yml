name: FamilyPoints CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushes keep the fast superseding behavior. Explicit release-gate runs
# are isolated by run ID and cannot be cancelled by unrelated main pushes.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('family-points-manual-{0}', github.run_id) || format('family-points-ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    name: CI / determine affected components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      android: ${{ steps.scope.outputs.android }}
      web: ${{ steps.scope.outputs.web }}
      compose: ${{ steps.scope.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Safe changed-file routing (full on unknown/shared)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          b=false; a=false; w=false; c=false; full=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            full=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then base="$PR_BASE"; else base="$PUSH_BASE"; fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              full=true
            elif ! git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/fp-changed-files"; then
              full=true
            else
              while IFS= read -r file; do
                case "$file" in
                  frontend/*|qa/*) w=true ;;
                  android/*) a=true ;;
                  scripts/beta/*|compose.beta.yml|Dockerfile.beta) c=true ;;
                  docs/*|README.md|LICENSE) ;;
                  *) full=true ;;
                esac
              done < "$RUNNER_TEMP/fp-changed-files"
            fi
          fi
          if [[ "$full" == true ]]; then b=true; a=true; w=true; c=true; fi
          for name in backend android web compose; do
            case "$name" in
              backend) value="$b" ;;
              android) value="$a" ;;
              web) value="$w" ;;
              compose) value="$c" ;;
            esac
            echo "$name=$value" >> "$GITHUB_OUTPUT"
            echo "$name=$value" >> "$GITHUB_STEP_SUMMARY"
          done

  backend-tests:
    name: Java 21 / Maven / PostgreSQL Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Confirm Docker
        run: docker info
      - name: Print tested commit
        run: git rev-parse HEAD
      - name: Run all backend tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify
      - name: Publish Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  android-debug:
    name: Android / Gradle debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0"
      - name: Install stable Android SDK 36 for CI fallback
        run: sdkmanager "platforms;android-36"
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Print tested commit
        run: git rev-parse HEAD
      - name: Compile Android and run unit tests
        run: |
          chmod +x ./gradlew
          # The local Android Studio build remains on API 37; CI fallback compiles API 36.
          ./gradlew --no-daemon --stacktrace -PfamilyPointsCiAndroidSdk=36 :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Publish Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  frontend-build:
    name: Web / Node / Vite production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Print tested commit
        run: git rev-parse HEAD
      - name: Install dependencies
        run: npm ci
      - name: Check locale completeness
        run: npm run i18n:check
      - name: Run source-backed Web regression suite
        run: npm run test:regression
      - name: Lint Web source
        run: npm run lint
      - name: Compile frontend
        run: npm run build

  beta-compose-validation:
    name: BETA / Docker Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify compose and secrets placeholders
        env:
          DB_PASSWORD: ci-placeholder-not-a-real-secret
          JWT_SECRET: ci-placeholder-jwt-secret-not-real
        run: |
          docker compose -f compose.beta.yml config --quiet
          test -f Dockerfile.beta
          test -f frontend/Dockerfile.beta
          test -f frontend/deploy/nginx.beta.conf
          bash -n scripts/beta/smoke.sh
          bash -n scripts/beta/backup.sh
          test -f .env.beta.example

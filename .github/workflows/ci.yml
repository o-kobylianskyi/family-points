name: FamilyPoints CI

on:
  push:
    branches:
      - feature/task-soft-delete
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-points-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Java 21 / Maven / PostgreSQL Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Confirm Docker
        run: docker info
      - name: Run all backend tests
        run: ./mvnw -B -ntp clean verify
      - name: Publish Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

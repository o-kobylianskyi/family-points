name: family-points-beta
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_points
      POSTGRES_USER: family_points
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - beta_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_points -d family_points"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.beta
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://database:5432/family_points
      DB_USERNAME: family_points
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SPRING_PROFILES_ACTIVE: beta
      FAMILYPOINTS_WEB_URL: ${FAMILYPOINTS_WEB_URL:-https://family-point.com}
      FAMILYPOINTS_GLOBAL_ACCOUNT_REGISTRATION_ENABLED: ${FAMILYPOINTS_GLOBAL_ACCOUNT_REGISTRATION_ENABLED:-false}
      FAMILYPOINTS_MEMBER_EMAIL_INVITATIONS_ENABLED: ${FAMILYPOINTS_MEMBER_EMAIL_INVITATIONS_ENABLED:-false}
      FAMILYPOINTS_MAIL_FROM: ${FAMILYPOINTS_MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FAMILYPOINTS_GOOGLE_ENABLED: ${FAMILYPOINTS_GOOGLE_ENABLED:-false}
      FAMILYPOINTS_GOOGLE_REGISTRATION_ENABLED: ${FAMILYPOINTS_GOOGLE_REGISTRATION_ENABLED:-false}
      FAMILYPOINTS_GOOGLE_LINKING_ENABLED: ${FAMILYPOINTS_GOOGLE_LINKING_ENABLED:-false}
      FAMILYPOINTS_FIRST_FAMILY_ENABLED: ${FAMILYPOINTS_FIRST_FAMILY_ENABLED:-false}
    depends_on:
      database:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.beta
      args:
        VITE_API_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BETA_HTTP_PORT:-18080}:80"
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
    depends_on: [backend]
    networks: [internal]

volumes:
  beta_postgres:

networks:
  internal:
    driver: bridge

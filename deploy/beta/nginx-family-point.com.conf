# Enable ONLY after DNS and Let's Encrypt certificate for family-point.com exist.
# The nginx worker must be able to read /var/www/familypoints-beta.
# Existing DEV sites :8443, wg0 and 1C :8080 DNAT must not be edited.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name family-point.com;

    ssl_certificate /etc/letsencrypt/live/family-point.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/family-point.com/privkey.pem;

    root /var/www/familypoints-beta;
    index index.html;

    server_tokens off;
    client_max_body_size 8m;

    location ~ ^/(auth|api|workspaces)(/|$) {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\\. {
        deny all;
    }
}

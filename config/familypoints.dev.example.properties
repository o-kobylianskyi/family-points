# FamilyPoints DEV-only service configuration TEMPLATE — safe to commit.
# Copy to config/familypoints.dev.local.properties and set PRIVATE values there.
# The .local file is gitignored. Do not use this template or local settings on Contabo BETA.
# application.properties imports ./config/familypoints.dev.local.properties (optional).

# Database (existing DEV DB; no migrations/deployment by editing this file alone)
spring.datasource.url=jdbc:postgresql://localhost:5432/family_points
spring.datasource.username=family_points
# REQUIRED: uncomment and insert your LOCAL secret (never commit):
# spring.datasource.password=

# JWT
# REQUIRED: uncomment and insert your existing LOCAL signing secret:
# security.jwt.secret=

# Account registration and family creation
familypoints.global-account-registration.enabled=true
familypoints.first-family.enabled=true
familypoints.additional-family.enabled=true

# Transactional email via Brevo
familypoints.web-url=http://localhost:5173
familypoints.mail.from=no-reply@family-point.com
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=be2eb3001@smtp-brevo.com
# REQUIRED: uncomment and insert SMTP key into .local file only:
# spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Google account login/signup (OFF until OAuth Web client configured/tested)
# Public Client ID, not OAuth Client Secret; must equal frontend/.env.local VITE_GOOGLE_CLIENT_ID
familypoints.google.client-id=
familypoints.google.enabled=false
familypoints.google.registration-enabled=false
familypoints.google.linking-enabled=false

# Existing feature gates outside application.properties can also be placed here;
# do not turn public endpoints on in BETA until integration/security checks pass.

# Targeted member email invitations (V33 required; OFF until tested)
familypoints.member-email-invitations.enabled=false

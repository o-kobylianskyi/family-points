spring.application.name=family-points
# Optional gitignored local DEV overrides. Never copy this file to Contabo BETA.
spring.config.import=optional:file:./config/familypoints.dev.local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/family_points}
spring.datasource.username=${DB_USERNAME:family_points}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns schema changes. Hibernate only validates mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=FamilyPoints current schema baseline

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration=3600000

# Password signup remains disabled until SMTP and public URL are configured and verified.
familypoints.global-account-registration.enabled=${FAMILYPOINTS_GLOBAL_ACCOUNT_REGISTRATION_ENABLED:false}
familypoints.web-url=${FAMILYPOINTS_WEB_URL:http://localhost:5173}
familypoints.mail.from=${FAMILYPOINTS_MAIL_FROM:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Google: configure the same OAuth Web client ID in frontend VITE_GOOGLE_CLIENT_ID.
familypoints.google.client-id=${GOOGLE_CLIENT_ID:}
familypoints.google.enabled=${FAMILYPOINTS_GOOGLE_ENABLED:false}
familypoints.google.registration-enabled=${FAMILYPOINTS_GOOGLE_REGISTRATION_ENABLED:false}
familypoints.google.linking-enabled=${FAMILYPOINTS_GOOGLE_LINKING_ENABLED:false}
